[project]
name = "lattice-backend"
version = "1.0.0"
description = "Lattice interview API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "sqlalchemy>=2.1.4",
  "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
